name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: JavaScript and Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130
      # The host embeds ui/dist (gitignored), so the interface is built before the tests.
      - run: bash scripts/build-ui.sh
      - run: npm ci
      - run: npm test
      - run: cargo test
      - run: cargo test -p aion2-core
      - run: cargo test -p aion2-ui

  build:
    name: Windows executable
    needs: test
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130
      - name: Build interface
        shell: bash
        run: bash scripts/build-ui.sh
      - run: npm ci
      - name: Resolve version
        id: version
        shell: bash
        run: |
          crate=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/v}"
            if [[ "$tag" != "$crate" ]]; then
              echo "Tag v$tag does not match Cargo.toml version $crate" >&2
              exit 1
            fi
            echo "value=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "value=v$crate" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: cargo build --release

      - name: Headless self-test (embedded assets, official lookup, guide fetch)
        shell: bash
        run: |
          AION2_SELFTEST=selftest.json ./target/release/AION2-Damage-Calculator.exe
          cat selftest.json
          node -e "const r=require('./selftest.json'); if(!r.embedded.index||!r.embedded.ui_js||!r.embedded.ui_wasm) process.exit(1)"

      - name: Checksum
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/AION2-Damage-Calculator.exe dist/
          cd dist
          sha256sum AION2-Damage-Calculator.exe > AION2-Damage-Calculator.exe.sha256
          cat AION2-Damage-Calculator.exe.sha256
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: AION2-Damage-Calculator-${{ steps.version.outputs.value }}
          path: |
            dist/AION2-Damage-Calculator.exe
            dist/AION2-Damage-Calculator.exe.sha256
          if-no-files-found: error
          compression-level: 0

  release:
    name: GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: AION2-Damage-Calculator-*
          merge-multiple: true
          path: release
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          files: |
            release/AION2-Damage-Calculator.exe
            release/AION2-Damage-Calculator.exe.sha256
          generate_release_notes: true
          make_latest: true
          body: |
            Windows x64 executable (Rust + WebView2) with Google Gemini API integration.
            Requirements: Windows x64 and Microsoft Edge WebView2 Runtime.
            Verify the download with the attached SHA-256 file.
