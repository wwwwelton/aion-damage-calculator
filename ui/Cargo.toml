[package]
name = "aion2-ui"
version = "0.1.0"
edition = "2021"
publish = false
description = "AION 2 calculator interface compiled to WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aion2-core = { path = "../core" }
leptos = { version = "=0.8.22", features = ["csr"] }
# Must match the wasm-bindgen-cli version used by scripts/build-ui.sh.
wasm-bindgen = "=0.2.130"
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Document", "EventTarget", "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "Navigator", "Window"] }
