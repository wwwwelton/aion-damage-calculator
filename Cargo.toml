[package]
name = "aion2-calculator"
version = "1.4.0"
edition = "2021"
publish = false
description = "AION 2 damage calculator with a Windows WebView2 interface"

[workspace]
members = [".", "core", "ui"]
default-members = ["."]

[[bin]]
name = "AION2-Damage-Calculator"
path = "src/main.rs"

[dependencies]
futures = "0.3"
hickory-resolver = { version = "0.26.3", default-features = false, features = ["tokio"] }
html-escape = "0.3"
mime_guess = "2"
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip", "json"] }
rust-embed = { version = "8", features = ["include-exclude"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }

[target.'cfg(windows)'.dependencies]
rfd = "0.17"
tao = "0.37"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }
wry = "0.57"

# Keep release codegen parallelism modest; high whole-crate optimization can exhaust memory on Windows.
[profile.release]
opt-level = 2
codegen-units = 16
lto = false
strip = "debuginfo"
